server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Runtime config and the HTML shell must never be cached, so reconfiguring
    # the container (new env vars) takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed assets — safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths (/callback, /courier, ...) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
